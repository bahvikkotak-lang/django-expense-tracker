<!DOCTYPE html>
<html>
<head>
    <title>Edit Transaction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container mt-5">
    <h2>Edit Transaction</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Title</label>
            <input type="text" name="title" value="{{ transaction.title }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Amount</label>
            <input type="number" step="0.01" name="amount" value="{{ transaction.amount }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Type</label>
            <select name="type" class="form-select">
                <option value="income" {% if transaction.transaction_type == "income" %}selected{% endif %}>
                    Income
                </option>
                <option value="expense" {% if transaction.transaction_type == "expense" %}selected{% endif %}>
                    Expense
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Update</button>
        <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>

    </form>
</div>

</body>
</html>
